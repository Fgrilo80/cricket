name: question-bank-length

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Length-bias lint
        run: python3 scripts/lint_option_length.py
      - name: Unit test
        run: python3 -m unittest tests/test_option_length.py
